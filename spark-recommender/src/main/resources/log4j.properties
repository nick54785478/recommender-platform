# Set root logger level to INFO and its only appender to CONSOLE.
log4j.rootLogger=INFO, CONSOLE

# CONSOLE appender definition
log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Silence overly chatty Spark and Hadoop logs
log4j.logger.org.apache.spark=WARN
log4j.logger.org.apache.hadoop=WARN
log4j.logger.org.sparkproject=WARN
log4j.logger.org.apache.zookeeper=WARN
log4j.logger.org.apache.hbase=WARN

# Keep our own logs at INFO
log4j.logger.com.omni.recommender.spark=INFO
